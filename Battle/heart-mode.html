<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyDrop Live Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>

body{
    background:#0f172a;
    font-family:Arial;
    color:#fff;
    padding:15px;
}

/* APP CARD */
.app{
    max-width:650px;
    margin:auto;
}

/* TOP BAR */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.title{
    font-size:22px;
    font-weight:900;
}

.hearts{
    font-size:20px;
}

/* CARD */
.card-box{
    background:#111827;
    border-radius:25px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

/* QUESTION */
.q{
    font-size:20px;
    font-weight:800;
    margin-bottom:18px;
}

/* OPTION */
.opt{
    width:100%;
    padding:14px;
    border:none;
    border-radius:15px;
    margin-bottom:12px;
    background:#1f2937;
    color:#fff;
    text-align:left;
    font-weight:700;
    transition:.2s;
}

.opt:hover{
    background:#374151;
}

.opt.correct{
    background:#16a34a !important;
}

.opt.wrong{
    background:#dc2626 !important;
}

/* BOTTOM */
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#0b1220;
    padding:12px;
}

.btn-next{
    width:100%;
    padding:14px;
    border:none;
    border-radius:15px;
    background:#f97316;
    color:#fff;
    font-weight:800;
}

/* PROGRESS */
.progress{
    height:8px;
    border-radius:20px;
    margin-bottom:10px;
}

/* LOADER */
.loader{
    width:50px;
    height:50px;
    border:5px solid #333;
    border-top:5px solid #f97316;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

/* GAME OVER */
.gameover{
    text-align:center;
    padding:30px;
}

</style>

</head>

<body>

<div id="app" class="app">

<!-- LOADING -->
<div v-if="loading" class="text-center mt-5">
    <div class="loader"></div>
    <h5 class="mt-3">Loading Quiz...</h5>
</div>

<!-- GAME -->
<div v-if="!loading && !gameOver">

    <div class="top">

        <div class="title">
            Live Quiz 🔥
        </div>

        <div class="hearts">
            ❤️ {{ hearts }}
        </div>

    </div>

    <div class="card-box">

        <div class="progress">
            <div class="progress-bar bg-warning"
            :style="{width: progress + '%'}"></div>
        </div>

        <div class="q">
            Q{{ index+1 }}. {{ current.question }}
        </div>

        <button
        v-for="(o,i) in current.options"
        :key="i"
        class="opt"
        :class="getClass(i)"
        @click="select(i)"
        :disabled="answered"
        >
            {{ o }}
        </button>

    </div>

</div>

<!-- GAME OVER -->
<div v-if="gameOver" class="gameover">

    <h2>💀 Game Over</h2>
    <p>You lost all hearts!</p>

    <button class="btn btn-warning w-100 mt-3"
    onclick="location.reload()">
        Play Again
    </button>

</div>

<!-- BOTTOM -->
<div v-if="!loading && !gameOver" class="bottom">

    <button class="btn-next"
    :disabled="selected==null || answered"
    @click="next">
        {{ index==9 ? 'Finish Game' : 'Next Question' }}
    </button>

</div>

</div>

<script>

const { createApp } = Vue;

createApp({

data(){

    return{

        loading:true,

        questions:[],

        index:0,

        selected:null,

        answered:false,

        hearts:3,

        gameOver:false,

        correct:false

    }

},

computed:{

    current(){
        return this.questions[this.index] || {};
    },

    progress(){
        return ((this.index)/10)*100;
    }

},

methods:{

    async load(){

        const res = await fetch(
            "https://sparrow-tech06.github.io/SkyDrop/data/quiz-data.json"
        );

        const data = await res.json();

        let all = [];

        data.quizzes.forEach(q=>{
            q.questions.forEach(x=>{
                all.push(x);
            });
        });

        // shuffle
        all = all.sort(()=>Math.random()-0.5);

        // take 10 questions
        this.questions = all.slice(0,10);

        this.loading = false;

    },

    select(i){

        if(this.answered) return;

        this.selected = i;

    },

    getClass(i){

        if(!this.answered) return "";

        if(i === this.current.answer){
            return "correct";
        }

        if(i === this.selected && i !== this.current.answer){
            return "wrong";
        }

        return "";

    },

    next(){

        if(this.selected === this.current.answer){
            // correct
        }else{
            this.hearts--;
        }

        this.answered = true;

        setTimeout(()=>{

            if(this.hearts <= 0){
                this.gameOver = true;
                return;
            }

            this.index++;
            this.selected = null;
            this.answered = false;

            if(this.index >= 10){
                this.gameOver = true;
            }

        },800);

    }

},

mounted(){
    this.load();
}

}).mount("#app");

</script>

</body>
  </html>
