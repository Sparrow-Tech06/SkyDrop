<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Quiz Light - Auto Next</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="style/heart.css">

<style>
/* Additional override to ensure bottom button is completely hidden/removed */
.bottom {
    display: none !important;
}
.btn-next {
    display: none !important;
}
</style>

</head>

<body>

<div id="app" class="app">

<!-- LOADING -->
<div v-if="loading" class="text-center mt-5">
    <div class="loader"></div>
    <p class="mt-3 fw-bold">Loading Quiz...</p>
</div>

<!-- TOP -->
<div v-if="!loading && !gameOver" class="top">

    <div class="title">Live Quiz ⚡</div>

    <div class="lives">

        <div
        v-for="i in 3"
        :key="i"
        class="life"
        :class="lifeClass(i)"
        >
            ❤️
        </div>

    </div>

</div>

<!-- GAME -->
<div v-if="!loading && !gameOver" class="card">

    <div class="progress">
        <div class="progress-bar bg-warning"
        :style="{width:progress+'%'}"></div>
    </div>

    <div class="q">
        Q{{ index+1 }}. {{ current.question }}
    </div>

    <button
    v-for="(o,i) in current.options"
    :key="i"
    class="opt"
    :class="getClass(i)"
    @click="selectAndAutoNext(i)"
    :disabled="answered"
    >
        {{ o }}
    </button>

</div>

<!-- GAME OVER -->
<div v-if="gameOver" class="gameover">

    <h2>Game Over 💥</h2>
    <p>You lost all lives or finished quiz</p>

    <button class="btn btn-warning w-100 mt-3" @click="restartQuiz">
        Restart
    </button>

</div>

<!-- BOTTOM - REMOVED NEXT BUTTON COMPLETELY -->
<!-- <div v-if="!loading && !gameOver" class="bottom">
    <button class="btn-next" ... ></button>
</div> -->

</div>

<script>

const { createApp } = Vue;

createApp({

data(){

return{
    loading:true,
    questions:[],
    index:0,
    selected:null,
    answered:false,
    lives:3,
    usedLives:0,
    gameOver:false,
    autoTimer: null  // for cleanup
}

},

computed:{
current(){
    return this.questions[this.index];
},
progress(){
    return (this.index/10)*100;
}
},

methods:{

async load(){

    const res = await fetch(
        "https://sparrow-tech06.github.io/SkyDrop/data/quiz-data.json"
    );
    const data = await res.json();
    let all = [];

    data.quizzes.forEach(q=>{
        q.questions.forEach(x=>{
            all.push(x);
        });
    });
    all = all.sort(()=>Math.random()-0.5);
    this.questions = all.slice(0,10);
    this.loading = false;

},

selectAndAutoNext(i){
    // If already answered or game over, do nothing
    if(this.answered || this.gameOver) return;
    
    // Select the answer
    this.selected = i;
    this.answered = true;
    
    // Check if answer is wrong
    if(i !== this.current.answer){
        this.usedLives++;
    }
    
    // Clear any existing timer
    if(this.autoTimer) clearTimeout(this.autoTimer);
    
    // Auto move to next question after delay (700ms for visual feedback)
    this.autoTimer = setTimeout(() => {
        // Check if game over due to lives
        if(this.usedLives >= 3){
            this.gameOver = true;
            this.autoTimer = null;
            return;
        }
        
        // Move to next question
        this.index++;
        this.selected = null;
        this.answered = false;
        
        // Check if quiz completed
        if(this.index >= 10){
            this.gameOver = true;
        }
        
        this.autoTimer = null;
    }, 700);
},

// Keep original select method for any reference but not used
select(i){
    // This method is kept for compatibility but not used
    if(this.answered) return;
    this.selected = i;
},

lifeClass(i){
    // i = 1,2,3
    if(i <= this.lives - this.usedLives){
        return "active";
    }else{
        return "used";
    }
},

getClass(i){
    if(!this.answered) return "";
    if(i === this.current.answer){
        return "correct";
    }
    if(i === this.selected && i !== this.current.answer){
        return "wrong";
    }
    return "";
},

// Removed next() method completely as it's no longer needed

// Add restart method for game over button
restartQuiz(){
    if(this.autoTimer) clearTimeout(this.autoTimer);
    location.reload();
}

},

mounted(){
    this.load();
},

beforeUnmount(){
    if(this.autoTimer) clearTimeout(this.autoTimer);
}

}).mount("#app");

</script>

</body>
</html>
