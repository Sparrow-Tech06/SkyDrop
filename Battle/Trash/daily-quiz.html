<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyDrop Daily Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
    --primary:#ff7a00;
    --soft:#fff4e8;
}

body{
    background:#f4f6fb;
    font-family:Arial,sans-serif;
    padding:18px 12px 100px;
}

.quiz-card{
    max-width:650px;
    margin:auto;
    background:#fff;
    border-radius:24px;
    padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.top-box{
    display:flex;
    align-items:center;
    gap:14px;
}

.quiz-icon{
    width:75px;
    height:75px;
    border-radius:20px;
    object-fit:cover;
    background:#eee;
}

.daily-badge{
    display:inline-block;
    background:var(--soft);
    color:var(--primary);
    font-size:13px;
    font-weight:700;
    padding:6px 14px;
    border-radius:50px;
}

.quiz-title{
    font-size:24px;
    font-weight:800;
    margin-top:7px;
}

.quiz-sub{
    color:#666;
    font-size:14px;
}

.question-box{
    margin-top:26px;
}

.question-no{
    color:var(--primary);
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
}

.question{
    font-size:21px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:22px;
}

.option{
    width:100%;
    border:none;
    border-radius:18px;
    background:#f7f7f7;
    padding:15px;
    text-align:left;
    margin-bottom:14px;
    font-weight:600;
    transition:.2s;
}

.option:hover{
    background:#ffe1bf;
}

.option.active{
    background:var(--primary);
    color:#fff;
}

.bottom-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    padding:12px;
    box-shadow:0 -5px 20px rgba(0,0,0,.08);
}

.progress{
    height:8px;
    border-radius:50px;
    margin-bottom:12px;
}

.btn-next{
    width:100%;
    border:none;
    border-radius:16px;
    padding:15px;
    background:var(--primary);
    color:#fff;
    font-weight:700;
    font-size:17px;
}

.btn-next:disabled{
    opacity:.5;
}

.loading{
    text-align:center;
    padding:60px 20px;
}

.result-box{
    text-align:center;
    padding:20px 10px;
}

.score{
    font-size:55px;
    font-weight:900;
    color:var(--primary);
}

</style>
</head>
<body>

<div class="quiz-card">

    <div id="loadingBox" class="loading">
        <div class="spinner-border text-warning"></div>

        <div class="mt-3 fw-bold">
            Loading Daily Quiz...
        </div>
    </div>

    <div id="quizContent" style="display:none;">

        <div class="top-box">

            <img id="quizIcon" class="quiz-icon" src="">

            <div>

                <div class="daily-badge">
                    DAILY QUIZ
                </div>

                <div class="quiz-title" id="quizTitle">
                    Quiz
                </div>

                <div class="quiz-sub" id="quizSub">
                    0 Questions
                </div>

            </div>

        </div>

        <div class="question-box">

            <div class="question-no" id="questionNo">
                Question 1
            </div>

            <div class="question" id="questionText">
                Loading...
            </div>

            <div id="optionsContainer"></div>

        </div>

    </div>

</div>

<div class="bottom-bar">

    <div class="progress">
        <div class="progress-bar bg-warning"
             id="progressBar"
             style="width:0%">
        </div>
    </div>

    <button class="btn-next"
            id="nextBtn"
            disabled>
        Next Question
    </button>

</div>

<!-- RESULT MODAL -->

<div class="modal fade" id="resultModal">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 rounded-4">

            <div class="modal-body">

                <div class="result-box">

                    <div class="text-muted">
                        Quiz Completed
                    </div>

                    <div class="score"
                         id="finalScore">
                        0/0
                    </div>

                    <h4 class="fw-bold mt-3">
                        Great Job 🔥
                    </h4>

                    <p class="text-muted">
                        New daily quiz every day.
                    </p>

                    <button class="btn btn-warning w-100 rounded-4 py-3 fw-bold"
                            onclick="location.reload()">

                        Play Again

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const DATA_URL =
"https://sparrow-tech06.github.io/SkyDrop/data/quiz-data.json";

let selectedQuiz = null;
let questions = [];

let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;

// ======================================
// FETCH QUIZ JSON
// ======================================

async function loadQuizData(){

    try{

        const response = await fetch(DATA_URL);

        const data = await response.json();

        // Daily random quiz
        const today =
            new Date().getDate();

        selectedQuiz =
            data.quizzes[
                today % data.quizzes.length
            ];

        questions =
            selectedQuiz.questions;

        initQuiz();

    }catch(error){

        document.getElementById("loadingBox")
        .innerHTML = `
            <div class="text-danger fw-bold">
                Failed to load quiz data
            </div>
        `;

        console.error(error);

    }

}

// ======================================
// INIT QUIZ
// ======================================

function initQuiz(){

    document.getElementById("loadingBox")
    .style.display = "none";

    document.getElementById("quizContent")
    .style.display = "block";

    document.getElementById("quizTitle")
    .innerText = selectedQuiz.title;

    document.getElementById("quizIcon")
    .src = selectedQuiz.icon;

    document.getElementById("quizSub")
    .innerText =
        questions.length + " Questions";

    loadQuestion();

}

// ======================================
// LOAD QUESTION
// ======================================

function loadQuestion(){

    selectedAnswer = null;

    nextBtn.disabled = true;

    const q =
        questions[currentQuestion];

    document.getElementById("questionNo")
    .innerText =
        `Question ${currentQuestion + 1}`;

    document.getElementById("questionText")
    .innerText =
        q.question;

    const optionsContainer =
        document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";

    q.options.forEach((option,index)=>{

        const btn =
            document.createElement("button");

        btn.className = "option";

        btn.innerText = option;

        btn.onclick = ()=>{

            document
            .querySelectorAll(".option")
            .forEach(el=>{
                el.classList.remove("active");
            });

            btn.classList.add("active");

            selectedAnswer = index;

            nextBtn.disabled = false;

        };

        optionsContainer.appendChild(btn);

    });

    updateProgress();

}

// ======================================
// NEXT
// ======================================

const nextBtn =
document.getElementById("nextBtn");

nextBtn.addEventListener("click",()=>{

    if(
        selectedAnswer ===
        questions[currentQuestion].answer
    ){
        score++;
    }

    currentQuestion++;

    if(currentQuestion < questions.length){

        loadQuestion();

    }else{

        showResult();

    }

});

// ======================================
// PROGRESS
// ======================================

function updateProgress(){

    const percent =
        (currentQuestion / questions.length) * 100;

    document.getElementById("progressBar")
    .style.width =
        percent + "%";

}

// ======================================
// RESULT
// ======================================

function showResult(){

    document.getElementById("progressBar")
    .style.width = "100%";

    document.getElementById("finalScore")
    .innerText =
        `${score}/${questions.length}`;

    const modal =
        new bootstrap.Modal(
            document.getElementById("resultModal")
        );

    modal.show();

}

// ======================================

loadQuizData();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
